name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *" # Roda diariamente
  workflow_dispatch:

jobs:
  build:
    name: Jobs to update snake image
    runs-on: ubuntu-latest
    steps:
      # Checkout do repositório
      - uses: actions/checkout@v2

      # Gerar animação da cobra no GitHub
      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: AmandaLisboa-Ramos
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      # Commit e push das imagens geradas para a branch 'gh-pages'
      - name: Commit and push to the gh-pages branch
        uses: crazy-max/ghaction-github-pages@v2.1.3
        with:
          target_branch: gh-pages
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
